<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register-Tnak Rean</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: white;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: blueviolet;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:hover {
      background-color: #9e3bb2;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
      color: rgb(130, 180, 255);
    }
  </style>
</head>
<body>
  <h1>Register</h1>

  <div class="container">
    <form id="registerForm">
      <input type="text" id="name" placeholder="Name" required><br>
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <input type="text" id="registrationCode" placeholder="Registration Code" required><br>
      <button type="submit">Register</button>
    </form>

    <p id="message" class="result"></p>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
  
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const registrationCode = document.getElementById('registrationCode').value;
      const schoolName = 'N/A'; // default value
  
      try {
        const response = await fetch('http://localhost:3000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, registrationCode, schoolName })
        });
  
        const data = await response.json();
        document.getElementById('message').innerText = data.message;
  
        
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('message').innerText = 'Something went wrong!';
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
